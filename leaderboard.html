<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard - HelpHub AI</title>
  <link rel="stylesheet" href="css/global.css">
  <style>
    .leaderboard-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--spacing-xl);
      margin-top: var(--spacing-xl);
    }

    .ranking-item {
      display: flex;
      gap: var(--spacing-lg);
      padding: var(--spacing-lg);
      border-bottom: 1px solid var(--border-light);
      align-items: center;
    }

    .ranking-item:last-child {
      border-bottom: none;
    }

    .ranking-number {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--teal-accent);
      min-width: 50px;
    }

    .ranking-info {
      flex: 1;
    }

    .ranking-name {
      font-weight: 600;
      margin-bottom: var(--spacing-xs);
    }

    .ranking-skills {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: var(--spacing-sm);
    }

    .ranking-stats {
      display: flex;
      gap: var(--spacing-md);
      font-size: 0.875rem;
      color: var(--text-light);
    }

    .trust-percentage {
      font-weight: 600;
      color: var(--teal-accent);
      text-align: right;
    }

    .badge-item {
      padding: var(--spacing-lg);
      border-bottom: 1px solid var(--border-light);
    }

    .badge-item:last-child {
      border-bottom: none;
    }

    .badge-header {
      display: flex;
      gap: var(--spacing-md);
      align-items: center;
      margin-bottom: var(--spacing-md);
    }

    .badge-title {
      font-weight: 600;
      flex: 1;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background-color: var(--border-light);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: var(--spacing-sm);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #f59e0b 0%, #10b981 100%);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .progress-text {
      font-size: 0.75rem;
      color: var(--text-light);
    }

    @media (max-width: 1024px) {
      .leaderboard-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="header-container">
      <div class="logo">
        <div class="logo-badge">H</div>
        <span>HelpHub AI</span>
      </div>
      <nav>
        <a href="index.html">Home</a>
        <a href="explore.html">Explore</a>
        <a href="leaderboard.html">Leaderboard</a>
        <a href="ai-center.html">AI Center</a>
        <a href="login.html" class="btn btn-primary btn-small">Dashboard</a>
      </nav>
    </div>
  </header>

  <!-- Hero -->
  <div class="hero">
    <div class="container">
      <p class="section-title" style="color: rgba(255, 255, 255, 0.7);">LEADERBOARD</p>
      <h1>Recognize the people who keep the community moving.</h1>
      <p>Trust score, contribution count, and badges create visible momentum for reliable helpers.</p>
    </div>
  </div>

  <!-- Main Content -->
  <section class="section">
    <div class="container">
      <div class="leaderboard-container">
        <!-- Rankings -->
        <div>
          <p class="section-title">TOP HELPERS</p>
          <h3 class="mb-lg">Rankings</h3>
          <div class="card">
            <div id="rankings-list">
              <!-- Populated by JavaScript -->
            </div>
          </div>
        </div>

        <!-- Badge System -->
        <div>
          <p class="section-title">BADGE SYSTEM</p>
          <h3 class="mb-lg">Trust and achievement</h3>
          <div class="card">
            <div id="badges-list">
              <!-- Populated by JavaScript -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="data/sample-data.js"></script>
  <script src="js/utils.js"></script>
  <script>
    function loadLeaderboard() {
      const users = getUsers().sort((a, b) => b.trustScore - a.trustScore);

      // Populate rankings
      const rankingsList = document.getElementById('rankings-list');
      rankingsList.innerHTML = users.map((user, index) => `
        <div class="ranking-item">
          <div class="ranking-number">#${index + 1}</div>
          <div class="ranking-info">
            <div class="ranking-name">${user.name}</div>
            <div class="ranking-skills">${user.skills.slice(0, 3).join(', ')}</div>
            <div class="ranking-stats">
              <span>${user.contributions} contributions</span>
            </div>
          </div>
          <div class="trust-percentage">${user.trustScore}%</div>
        </div>
      `).join('');

      // Badge system
      const badgesList = document.getElementById('badges-list');
      const badges = [
        { name: 'Hassan Ali', type: 'Code Rescuer • Bug Hunter', progress: 88 },
        { name: 'Sara Noor', type: 'Community Voice', progress: 74 },
        { name: 'Ayesha Khan', type: 'Design Ally • Fast Responder • Top Mentor', progress: 100 }
      ];

      badgesList.innerHTML = badges.map(badge => `
        <div class="badge-item">
          <div class="badge-header">
            <div class="badge-title">${badge.name}</div>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" style="width: ${badge.progress}%"></div>
          </div>
          <div class="flex-between">
            <div class="progress-text">${badge.type}</div>
            <div class="progress-text">${badge.progress}%</div>
          </div>
        </div>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', loadLeaderboard);
  </script>
</body>
</html>
